function buildLevel(i){
  const def=LEVELS[i], w=def.w;
  const g=[...Array(ROWS)].map(()=>Array(w).fill(' '));
  const L={i,name:def.name,g,w,embers:[],enemies:[],movers:[],tramps:[],checks:[],goal:null,start:null,boss:null,won:0};
  const fill=(x1,x2,y1,y2,c)=>{for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)if(x>=0&&x<w&&y>=0&&y<ROWS)g[y][x]=c};
  const a={
    ground:(x1,x2,top)=>fill(x1,x2,top,ROWS-1,'#'),
    ceil:(x1,x2,bot)=>fill(x1,x2,0,bot,'#'),
    plat:(x1,x2,y)=>fill(x1,x2,y,y,'='),
    spikes:(x1,x2,y)=>fill(x1,x2,y,y,'^'),
    gate:(x)=>fill(x,x,0,11,'X'),
    ember:(x,y)=>L.embers.push({x:x*T+16,y:y*T+16,got:false,ph:Math.random()*6}),
    embers:(x1,x2,y)=>{for(let x=x1;x<=x2;x++)a.ember(x,y)},
    enemy:(x,top,d)=>L.enemies.push({x:x*T+3,y:top*T-22,w:26,h:22,vx:def.spd*d,alive:true,dead:0,anim:Math.random()*5}),
    fly:(x,y,range)=>L.enemies.push({fly:true,ox:x*T+3,oy:y*T+5,x:x*T+3,y:y*T+5,w:26,h:20,vx:1,range:range*T,sp:1+def.spd/100,t:Math.random()*6,alive:true,dead:0,anim:0}),
    mover:(x,y,len,axis,range,sp)=>L.movers.push({ox:x*T,oy:y*T,x:x*T,y:y*T,w:len*T,h:12,axis,range:range*T,sp,t:0,dx:0,dy:0}),
    tramp:(x,top)=>L.tramps.push({x:x*T,y:top*T-14,w:2*T,h:14,sq:0}),
    check:(x,top)=>L.checks.push({x:x*T+16,y:top*T,lit:false}),
    goal:(x,top)=>L.goal={x:x*T+16,y:top*T,lit:false},
    start:(x,top)=>L.start={x:x*T+6,y:top*T-28},
    boss:(x,top,ax1,ax2)=>L.boss={x:x*T,y:top*T-76,w:88,h:76,vx:0,vy:0,floor:top*T-76,ax1:ax1*T,ax2:ax2*T,
      alive:true,active:false,onGround:true,jumpT:1.5,anim:0,dead:0,sq:0},
  };
  def.build(a);
  return L;
}

let AC=null, muted=false;
function initAudio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function beep(f,d,type='square',slide=0,vol=.06){
  if(!AC||muted) return; const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d);
}

  boing:()=>beep(180,.3,'sine',520,.09),
  roar:()=>{beep(110,.8,'sawtooth',-50,.07);beep(82,.9,'square',-30,.04)},
  thud:()=>beep(90,.25,'square',-50,.08),
  bossDie:()=>[220,180,140,110,80].forEach((f,i)=>setTimeout(()=>beep(f,.35,'sawtooth',-40,.07),i*120)),
  win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.25,'triangle',0,.06),i*110))};

/* ---------- 파티클 ---------- */
function burst(x,y,n,col,spd=160,life=.6,size=3){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(.3+Math.random()*.7);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:life*(.6+Math.random()*.4),max:life,col,size})}
}

/* ---------- 업데이트 ---------- */
const ACC=2400, FRIC=2800, MAXV=230, G=1900, JV=640, COYOTE=.09, BUF=.12, MAXFALL=900;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function update(dt){
  time+=dt; shake=Math.max(0,shake-dt);
  for(const m of L.movers){ m.t+=dt; const k=(1-Math.cos(m.t*m.sp))/2;
    const nx=m.ox+(m.axis==='x'?m.range*k:0), ny=m.oy+(m.axis==='y'?m.range*k:0);
    m.dx=nx-m.x; m.dy=ny-m.y; m.x=nx; m.y=ny; }
  for(const e of L.enemies){
    if(!e.alive){ e.dead+=dt; continue; }
    e.anim+=dt;
    if(e.fly){ e.t+=dt*e.sp; const nx=e.ox+Math.sin(e.t)*e.range; e.vx=nx-e.x; e.x=nx; e.y=e.oy+Math.sin(e.t*2.3)*8; continue; }
    e.x+=e.vx*dt;
    const front=e.vx>0?e.x+e.w:e.x, tx=Math.floor(front/T);
    const wall=tile(tx,Math.floor((e.y+e.h-4)/T)), fl=tile(tx,Math.floor((e.y+e.h+2)/T));
    if(wall==='#'||wall==='^'||!(fl==='#'||fl==='=')){ e.vx*=-1; e.x+=e.vx*dt*2; }
  }
  for(const t of L.tramps) t.sq*=Math.pow(.004,dt);
  updateBoss(dt);
  if(L.won>0){ L.won-=dt; p.vx*=.9; if(L.won<=0) levelClear(); }
  else if(p.dead>0){ p.dead-=dt; if(p.dead<=0){ p=newPlayer(); } }
  else updatePlayer(dt);
  for(const q of parts){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=500*dt; q.life-=dt; }
  parts=parts.filter(q=>q.life>0);
  const target=p.x+p.w/2-VW*.42; cam+=(target-cam)*Math.min(1,dt*7);
  cam=clamp(cam,0,L.w*T-VW);
  jumpPressed=false;
}

function updateBoss(dt){
  const b=L.boss; if(!b) return;
  if(!b.alive){ b.dead+=dt; return; }
  b.anim+=dt; b.sq*=Math.pow(.01,dt);
  if(!b.active){ if(p.dead<=0&&p.x>b.ax1-T*.5){ b.active=true; sfx.roar(); shake=.5; } else return; }
  const dir=Math.sign(p.x+p.w/2-(b.x+b.w/2))||1;
  if(b.onGround){
    b.vx=clamp(b.vx+dir*500*dt,-95,95);
    b.jumpT-=dt;
    if(b.jumpT<=0){ b.vy=-700; b.vx=dir*190; b.onGround=false; b.sq=-.2; b.jumpT=1.3+Math.random()*1.1; }
  }
  b.vy+=G*dt; b.x+=b.vx*dt; b.y+=b.vy*dt;
  if(b.y>=b.floor){
    if(!b.onGround){ shake=.3; b.sq=.25; sfx.thud(); b.vx*=.3;
      burst(b.x+10,b.floor+b.h,8,'rgba(200,190,220,.6)',120,.4,3); burst(b.x+b.w-10,b.floor+b.h,8,'rgba(200,190,220,.6)',120,.4,3); }
    b.y=b.floor; b.vy=0; b.onGround=true;
  }
  if(b.x<b.ax1){ b.x=b.ax1; b.vx=Math.abs(b.vx); }
  if(b.x>b.ax2-b.w){ b.x=b.ax2-b.w; b.vx=-Math.abs(b.vx); }
}

function die(){
  if(p.dead>0) return; p.dead=.8; deaths++; sfx.die();
  burst(p.x+p.w/2,p.y+p.h/2,26,'#3a5a8c',220,.8,4); burst(p.x+p.w/2,p.y+p.h/2,10,'#ffd27a',180,.6,3);
}

function updatePlayer(dt){
  const dir=(keys.right?1:0)-(keys.left?1:0);
  if(dir){ const turn=Math.sign(p.vx)!==dir?2:1; p.vx+=dir*ACC*turn*dt; p.face=dir; }
  else { const f=FRIC*dt; p.vx=Math.abs(p.vx)<=f?0:p.vx-Math.sign(p.vx)*f; }
  p.vx=clamp(p.vx,-MAXV,MAXV);
  if(jumpPressed) p.buf=BUF; else p.buf-=dt;
  p.coyote=p.ground?COYOTE:p.coyote-dt;
  if(p.buf>0&&p.coyote>0){ p.vy=-JV; p.buf=0; p.coyote=0; p.ground=false; p.ride=null; p.squash=-.18; sfx.jump(); }
  if(p.vy>=0) p.spring=false;
  p.vy+=G*dt*(p.vy<0&&!keys.jump&&!p.spring?2.4:1); p.vy=Math.min(p.vy,MAXFALL);
  if(p.ride){ p.x+=p.ride.dx; p.y=p.ride.y-p.h; }

  // 가로
  p.x+=p.vx*dt;
  let top=Math.floor(p.y/T), bot=Math.floor((p.y+p.h-.01)/T);
  if(p.vx>0){ const tx=Math.floor((p.x+p.w)/T); for(let ty=top;ty<=bot;ty++) if(tile(tx,ty)==='#'){p.x=tx*T-p.w;p.vx=0;break} }
  else if(p.vx<0){ const tx=Math.floor(p.x/T); for(let ty=top;ty<=bot;ty++) if(tile(tx,ty)==='#'){p.x=(tx+1)*T;p.vx=0;break} }
  p.x=Math.max(0,p.x);

  // 세로
  const prevB=p.y+p.h, wasGround=p.ground; p.y+=p.vy*dt; p.ground=false; p.ride=null;
  const l=Math.floor(p.x/T), r=Math.floor((p.x+p.w-.01)/T);
  if(p.vy>=0){
    const ty=Math.floor((p.y+p.h)/T);
    for(let tx=l;tx<=r;tx++){ const c=tile(tx,ty);
      if(c==='#'||(c==='='&&prevB<=ty*T+.5)){ p.y=ty*T-p.h; p.vy=0; p.ground=true; } }
    for(const m of L.movers){
      if(p.x+p.w>m.x+2&&p.x<m.x+m.w-2&&prevB<=m.y-m.dy+2&&p.y+p.h>=m.y){ p.y=m.y-p.h; p.vy=0; p.ground=true; p.ride=m; }
    }
    for(const t of L.tramps){
      if(p.x+p.w>t.x+2&&p.x<t.x+t.w-2&&prevB<=t.y+2&&p.y+p.h>=t.y){
        p.y=t.y-p.h; p.vy=-(keys.jump?1040:920); p.spring=true; p.ground=false; p.coyote=0; t.sq=1; p.squash=-.25;
        sfx.boing(); burst(p.x+p.w/2,t.y,8,'#ff8a5c',120,.4,2.5); }
    }
  } else {
    const ty=Math.floor(p.y/T);
    for(let tx=l;tx<=r;tx++) if(tile(tx,ty)==='#'){ p.y=(ty+1)*T; p.vy=0; }
  }
  if(p.ground&&!wasGround){ p.squash=.22; burst(p.x+p.w/2,p.y+p.h,5,'rgba(200,190,220,.6)',60,.35,2); }
  p.squash*=Math.pow(.0005,dt);
  p.run+=Math.abs(p.vx)*dt*.06;

  // 가시
  top=Math.floor(p.y/T); bot=Math.floor((p.y+p.h-.01)/T);
  for(let ty=top;ty<=bot;ty++)for(let tx=l;tx<=r;tx++) if(tile(tx,ty)==='^'){
    const sx=tx*T+4, sy=ty*T+14; if(p.x<sx+24&&p.x+p.w>sx&&p.y<sy+18&&p.y+p.h>sy) return die(); }
  if(p.y>ROWS*T+40) return die();

  // 적
  for(const e of L.enemies){ if(!e.alive) continue;
    if(p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y){
      if(p.vy>0&&prevB<=e.y+10){ e.alive=false; p.vy=-JV*.72; sfx.stomp(); burst(e.x+e.w/2,e.y+e.h/2,14,'#2a2540',150,.5,4); }
      else return die();
    } }
  // 보스: 위를 밟으면 쓰러짐
  const b=L.boss;
  if(b&&b.alive){ const bx=b.x+8, bw=b.w-16, by=b.y+6, bh=b.h-6;
    if(p.x<bx+bw&&p.x+p.w>bx&&p.y<by+bh&&p.y+p.h>by){
      if(p.vy>0&&prevB<=by+18){ killBoss(); p.vy=-JV*.95; }
      else return die();
    } }
  // 불씨
  const cx=p.x+p.w/2, cy=p.y+p.h/2;
  for(const em of L.embers){ if(!em.got&&Math.hypot(em.x-cx,em.y-cy)<22){ em.got=true; sfx.ember(); burst(em.x,em.y,10,'#ffb347',120,.5,2.5); } }
  // 체크포인트
  for(const c of L.checks){ if(!c.lit&&Math.abs(c.x-cx)<20&&Math.abs(c.y-(p.y+p.h))<40){ c.lit=true; spawn={x:c.x-10,y:c.y-p.h}; sfx.check(); burst(c.x,c.y-40,16,'#ffb347',140,.7,3); } }
  // 골
  const gl=L.goal; if(!gl.lit&&Math.abs(gl.x-cx)<22&&p.y+p.h>gl.y-90){ gl.lit=true; L.won=1.2; sfx.win(); burst(gl.x,gl.y-86,40,'#ffd27a',240,1,3.5); }
}

function killBoss(){
  const b=L.boss; b.alive=false; b.dead=0; shake=.8; sfx.bossDie();
  for(let k=0;k<4;k++) burst(b.x+b.w/2,b.y+b.h/2,24,k%2?'#2a2540':'#ffd27a',300,1.1,5);
  for(let y=0;y<ROWS;y++)for(let x=0;x<L.w;x++) if(L.g[y][x]==='X'){ L.g[y][x]=' '; burst(x*T+16,y*T+16,3,'#8a7fa8',100,.6,3); }
}

function levelClear(){
  const got=L.embers.filter(e=>e.got).length, max=L.embers.length;
  total.embers+=got; total.max+=max; total.time+=time; total.deaths+=deaths;
  const last=lvl===LEVELS.length-1;
  writeSave(last?0:Math.max(loadSave(),lvl+1));
  state=last?'end':'clear';
  if(last) showOv('모든 등불이 켜졌음','그림자 왕이 쓰러지고 마을의 마지막 등불까지 다시 밝혔음. 긴 밤이 끝났음.',
      [[`${total.embers}/${total.max}`,'모은 불씨'],[fmt(total.time),'총 시간'],[total.deaths,'쓰러진 횟수']],'처음부터');
  else showOv(`${lvl+1}장 클리어`,lvl+1===LEVELS.length-1?'다음은 마지막 장. 그림자 왕이 기다리고 있음. 머리 위를 밟으면 쓰러짐.':'등불 하나가 켜졌음. 다음 길로 가면 됨.',
      [[`${got}/${max}`,'불씨'],[fmt(time),'시간'],[deaths,'쓰러짐']],'다음 장');
}
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;

/* ---------- 그리기 ---------- */
const stars=[...Array(80)].map(()=>({x:Math.random()*2000,y:Math.random()*260,r:Math.random()*1.4+.4,ph:Math.random()*6}));
function hillY(x,base,a,b){return base+Math.sin(x*.004)*a+Math.sin(x*.011+1.3)*b}

function draw(){
  ctx.clearRect(0,0,VW,VH);
  const dark=L?L.i/(LEVELS.length-1):0;
  const sky=ctx.createLinearGradient(0,0,0,VH);
  sky.addColorStop(0,'#0b0a1d'); sky.addColorStop(.55,dark>.85?'#2a1430':'#251c42'); sky.addColorStop(1,dark>.85?'#4a2030':'#46304f');
  ctx.fillStyle=sky; ctx.fillRect(0,0,VW,VH);
  for(const s of stars){ const x=((s.x-cam*.05)%2000+2000)%2000; if(x>VW) continue;
    ctx.globalAlpha=.4+.6*Math.abs(Math.sin(gT*1.3+s.ph)); ctx.fillStyle='#efe8d8'; ctx.fillRect(x,s.y,s.r,s.r); }
  ctx.globalAlpha=1;
  const mx=VW*.78-cam*.03;
  const mg=ctx.createRadialGradient(mx,90,10,mx,90,90); mg.addColorStop(0,'rgba(246,236,208,.35)'); mg.addColorStop(1,'rgba(246,236,208,0)');
  ctx.fillStyle=mg; ctx.fillRect(mx-90,0,180,180); ctx.fillStyle=dark>.85?'#f0b8a0':'#f6ecd0'; ctx.beginPath(); ctx.arc(mx,90,26,0,7); ctx.fill();
  ctx.fillStyle=dark>.85?'#2a1430':'#251c42'; ctx.beginPath(); ctx.arc(mx+10,84,22,0,7); ctx.fill();
  [[.2,'#2a2047',300,30,14],[.45,'#1c1733',350,22,18]].forEach(([par,col,base,a,b])=>{
    ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,VH);
    for(let x=0;x<=VW+8;x+=8) ctx.lineTo(x,hillY(x+cam*par,base,a,b)); ctx.lineTo(VW,VH); ctx.fill(); });

  if(!L) return;
  ctx.save();
  const sx=shake>0?(Math.random()-.5)*shake*16:0, sy=shake>0?(Math.random()-.5)*shake*16:0;
  ctx.translate(-Math.round(cam)+sx,sy);
  const c0=Math.max(0,Math.floor(cam/T)-1), c1=Math.min(L.w-1,Math.ceil((cam+VW)/T)+1);
  for(let ty=0;ty<ROWS;ty++)for(let tx=c0;tx<=c1;tx++){
    const c=L.g[ty][tx], x=tx*T, y=ty*T;
    if(c==='#'){
      ctx.fillStyle='#1d2031'; ctx.fillRect(x,y,T,T);
      const h=(tx*73+ty*151)%7; ctx.fillStyle='#262a3e'; ctx.fillRect(x+4+h*2,y+10+h,5,3); ctx.fillRect(x+18-h,y+22,4,3);
      if(ty>0&&tile(tx,ty-1)!=='#'){
        ctx.fillStyle='#4f6b45'; ctx.fillRect(x,y,T,7); ctx.fillStyle='#6d8f58'; ctx.fillRect(x,y,T,3);
        for(let k=0;k<3;k++) ctx.fillRect(x+5+k*10+(h%3),y-3,2,3);
      }
    } else if(c==='='){
      ctx.fillStyle='#7a5434'; ctx.fillRect(x,y,T,10); ctx.fillStyle='#a0714a'; ctx.fillRect(x,y,T,3);
      ctx.fillStyle='#5a3c24'; ctx.fillRect(x+T-2,y,2,10);
    } else if(c==='^'){
      ctx.fillStyle='#c9c4d8';
      for(let k=0;k<4;k++){ ctx.beginPath(); ctx.moveTo(x+k*8,y+T); ctx.lineTo(x+k*8+4,y+14); ctx.lineTo(x+k*8+8,y+T); ctx.fill(); }
    } else if(c==='X'){
      ctx.fillStyle='rgba(120,30,40,.25)'; ctx.fillRect(x,y,T,T);
      ctx.fillStyle='#5a5070'; ctx.fillRect(x+5,y,5,T); ctx.fillRect(x+22,y,5,T); ctx.fillRect(x,y+12,T,4);
    }
  }
  for(const m of L.movers){
    ctx.strokeStyle='rgba(255,179,71,.18)'; ctx.setLineDash([3,5]); ctx.beginPath();
    ctx.moveTo(m.ox+m.w/2,m.oy+6); ctx.lineTo(m.ox+m.w/2+(m.axis==='x'?m.range:0),m.oy+6+(m.axis==='y'?m.range:0)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#7a5434'; ctx.fillRect(m.x,m.y,m.w,m.h); ctx.fillStyle='#d79a5a'; ctx.fillRect(m.x,m.y,m.w,3);
    ctx.fillStyle='#ffb347'; ctx.fillRect(m.x+m.w/2-2,m.y+4,4,4);
  }
  for(const t of L.tramps){
    const d=t.sq*7*Math.cos(gT*30)*(t.sq>.05?1:0)+t.sq*5;
    ctx.fillStyle='#3b3550'; ctx.fillRect(t.x+6,t.y+4,4,10); ctx.fillRect(t.x+t.w-10,t.y+4,4,10);
    ctx.fillStyle='#5a5070'; ctx.fillRect(t.x+2,t.y+2,t.w-4,4);
    ctx.fillStyle='#e0533f'; ctx.beginPath(); ctx.moveTo(t.x+3,t.y+2);
    ctx.quadraticCurveTo(t.x+t.w/2,t.y+2+d*2,t.x+t.w-3,t.y+2); ctx.lineTo(t.x+t.w-3,t.y-2); ctx.quadraticCurveTo(t.x+t.w/2,t.y-2+d*2,t.x+3,t.y-2); ctx.fill();
    ctx.fillStyle='#ffd27a'; for(let k=1;k<6;k++) ctx.fillRect(t.x+k*t.w/6-1,t.y-2+d*(1-Math.abs(k-3)/3)*1.6,2,2);
  }
  for(const c of L.checks){
    ctx.fillStyle='#3b3550'; ctx.fillRect(c.x-2,c.y-44,4,44); ctx.fillStyle='#5a5070'; ctx.fillRect(c.x-9,c.y-48,18,6);
    if(c.lit) flame(c.x,c.y-52,1);
  }
  { const g=L.goal; ctx.fillStyle='#3b3550'; ctx.fillRect(g.x-3,g.y-80,6,80); ctx.fillRect(g.x-12,g.y-6,24,6);
    ctx.fillStyle='#5a5070'; ctx.fillRect(g.x-14,g.y-100,28,4); ctx.fillRect(g.x-11,g.y-96,22,20);
    ctx.fillStyle=g.lit?'#ffd27a':'#2a2540'; ctx.fillRect(g.x-8,g.y-93,16,14);
    glow(g.x,g.y-86,g.lit?150:40,g.lit?.55:.15+.1*Math.sin(gT*3)); }
  for(const e of L.embers){ if(e.got) continue; const y=e.y+Math.sin(gT*3+e.ph)*3;
    glow(e.x,y,22,.4); ctx.fillStyle='#ffb347'; ctx.beginPath(); ctx.arc(e.x,y,5,0,7); ctx.fill();
    ctx.fillStyle='#fff1c9'; ctx.beginPath(); ctx.arc(e.x-1,y-1,2,0,7); ctx.fill(); }
  for(const e of L.enemies) drawEnemy(e);
  drawBoss();
  if(p.dead<=0) drawPlayer();
  for(const q of parts){ ctx.globalAlpha=Math.max(0,q.life/q.max); ctx.fillStyle=q.col; ctx.fillRect(q.x,q.y,q.size,q.size); }
  ctx.globalAlpha=1; ctx.restore();

  // HUD
  const got=L.embers.filter(e=>e.got).length;
  ctx.fillStyle='rgba(16,14,32,.6)'; ctx.fillRect(10,10,250,58);
  ctx.fillStyle='#ffb347'; ctx.font='20px "Black Han Sans", sans-serif'; ctx.textBaseline='top'; ctx.textAlign='left'; ctx.fillText(L.name,20,16);
  ctx.fillStyle='#efe8d8'; ctx.font='15px "Gowun Dodum", sans-serif';
  ctx.fillText(`불씨 ${got}/${L.embers.length}   쓰러짐 ${deaths}   ${fmt(time)}`,20,44);
  const b=L.boss;
  if(b&&b.active&&b.alive){
    const w=Math.min(300,VW-40), x=(VW-w)/2;
    ctx.fillStyle='rgba(16,14,32,.7)'; ctx.fillRect(x-10,VH-52,w+20,40);
    ctx.fillStyle='#ff6b5a'; ctx.font='20px "Black Han Sans", sans-serif'; ctx.textAlign='center'; ctx.fillText('그림자 왕',VW/2,VH-48);
    ctx.fillStyle='#efe8d8'; ctx.font='13px "Gowun Dodum", sans-serif'; ctx.fillText('머리 위를 밟아야 쓰러짐',VW/2,VH-26);
    ctx.textAlign='left';
  }
}
function glow(x,y,r,a){ const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(255,200,110,${a})`); g.addColorStop(1,'rgba(255,200,110,0)');
  ctx.fillStyle=g; ctx.fillRect(x-r,y-r,r*2,r*2); }
function flame(x,y,s){ glow(x,y,60,.45); const f=Math.sin(gT*14)*1.5;
  ctx.fillStyle='#e2683c'; ctx.beginPath(); ctx.ellipse(x,y,6*s,9*s+f,0,0,7); ctx.fill();
  ctx.fillStyle='#ffd27a'; ctx.beginPath(); ctx.ellipse(x,y+2,3*s,5*s,0,0,7); ctx.fill(); }

function drawEnemy(e){
  if(!e.alive){ if(e.dead<.4){ ctx.globalAlpha=1-e.dead/.4; ctx.fillStyle='#0b0a14'; ctx.fillRect(e.x,e.y+e.h-6,e.w,6); ctx.globalAlpha=1;} return; }
  const d=e.vx>0?3:-3;
  if(e.fly){
    const flap=Math.sin(e.anim*18)*8, cx=e.x+e.w/2, cy=e.y+e.h/2;
    ctx.fillStyle='#0b0a14';
    ctx.beginPath(); ctx.moveTo(cx-4,cy); ctx.lineTo(cx-18,cy-6-flap); ctx.lineTo(cx-12,cy+4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx+4,cy); ctx.lineTo(cx+18,cy-6-flap); ctx.lineTo(cx+12,cy+4); ctx.fill();
    ctx.beginPath(); ctx.arc(cx,cy,9,0,7); ctx.fill();
    ctx.fillStyle='#ff6b5a'; ctx.fillRect(cx-5+d,cy-3,3,3); ctx.fillRect(cx+2+d,cy-3,3,3);
    return;
  }
  const wob=Math.sin(e.anim*10)*2;
  ctx.fillStyle='#0b0a14'; ctx.beginPath();
  ctx.moveTo(e.x,e.y+e.h); ctx.quadraticCurveTo(e.x,e.y+wob,e.x+e.w/2,e.y+wob); ctx.quadraticCurveTo(e.x+e.w,e.y-wob,e.x+e.w,e.y+e.h);
  for(let k=3;k>=0;k--) ctx.lineTo(e.x+k*e.w/4+e.w/8,e.y+e.h-(k%2?4:0)); ctx.fill();
  ctx.fillStyle='#ff6b5a'; ctx.fillRect(e.x+e.w/2-6+d,e.y+9,3,4); ctx.fillRect(e.x+e.w/2+3+d,e.y+9,3,4);
}

function drawBoss(){
  const b=L.boss; if(!b) return;
  if(!b.alive){ if(b.dead<1){ ctx.globalAlpha=1-b.dead; ctx.fillStyle='#0b0a14';
      const h=b.h*(1-b.dead); ctx.fillRect(b.x,b.y+b.h-h,b.w,h); ctx.globalAlpha=1; } return; }
  const cx=b.x+b.w/2, base=b.y+b.h;
  ctx.save(); ctx.translate(cx,base); ctx.scale(1+b.sq,1-b.sq);
  const w=b.w, h=b.h, wob=Math.sin(b.anim*6)*3;
  // 붉은 기운
  const rg=ctx.createRadialGradient(0,-h/2,10,0,-h/2,90); rg.addColorStop(0,'rgba(255,80,70,.25)'); rg.addColorStop(1,'rgba(255,80,70,0)');
  ctx.fillStyle=rg; ctx.fillRect(-100,-h-60,200,200);
  ctx.fillStyle='#0b0a14'; ctx.beginPath();
  ctx.moveTo(-w/2,0); ctx.quadraticCurveTo(-w/2-4,-h+wob,0,-h+wob); ctx.quadraticCurveTo(w/2+4,-h-wob,w/2,0);
  for(let k=6;k>=0;k--) ctx.lineTo(-w/2+k*w/6,(k%2?-6:0)); ctx.fill();
  // 왕관
  ctx.fillStyle='#d9a441'; ctx.beginPath(); const cy=-h+wob-2;
  ctx.moveTo(-22,cy); ctx.lineTo(-22,cy-14); ctx.lineTo(-11,cy-6); ctx.lineTo(0,cy-20); ctx.lineTo(11,cy-6); ctx.lineTo(22,cy-14); ctx.lineTo(22,cy); ctx.fill();
  ctx.fillStyle='#ff6b5a'; ctx.fillRect(-2,cy-10,4,4);
  // 눈과 입
  const dir=Math.sign(p.x-cx)*5;
  ctx.fillStyle='#ff6b5a'; ctx.fillRect(-20+dir,-h*.62,9,7); ctx.fillRect(11+dir,-h*.62,9,7);
  ctx.fillStyle='#ffd27a'; ctx.fillRect(-18+dir,-h*.62+2,3,3); ctx.fillRect(13+dir,-h*.62+2,3,3);
  ctx.strokeStyle='#ff6b5a'; ctx.lineWidth=2; ctx.beginPath();
  for(let k=0;k<6;k++) ctx.lineTo(-15+k*6+dir,-h*.38+(k%2?4:0)); ctx.stroke();
  ctx.restore();
}

function drawPlayer(){
  const cx=p.x+p.w/2, by=p.y+p.h;
  glow(cx+p.face*12,by-14,70,.35);
  ctx.save(); ctx.translate(cx,by); ctx.scale(1+p.squash,1-p.squash); ctx.scale(p.face,1);
  const step=p.ground&&Math.abs(p.vx)>10?Math.sin(p.run*6)*3:0;
  ctx.fillStyle='#22324f'; ctx.fillRect(-7,-6,5,6+(step>0?0:-2)); ctx.fillRect(2,-6,5,6+(step<0?0:-2));
  ctx.fillStyle='#3a5a8c'; ctx.beginPath(); ctx.moveTo(-11,-4); ctx.lineTo(-9,-24); ctx.quadraticCurveTo(0,-34,9,-24); ctx.lineTo(11,-4); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#f2d6b3'; ctx.beginPath(); ctx.arc(2,-20,6,0,7); ctx.fill();
  ctx.fillStyle='#1a1426'; ctx.fillRect(4,-21,2,3);
  ctx.fillStyle='#e0533f'; ctx.fillRect(-9,-14,19,4); ctx.fillRect(-11,-14,4,8+step*.5);
  ctx.strokeStyle='#8a7a68'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(9,-12); ctx.lineTo(12,-18); ctx.stroke();
  ctx.fillStyle='#5a5070'; ctx.fillRect(8,-18,8,2);
  ctx.fillStyle='#ffd27a'; ctx.fillRect(9,-16,6,8); ctx.fillStyle='#fff1c9'; ctx.fillRect(11,-14,2,4);
  ctx.restore();
}

/* ---------- 오버레이 ---------- */
const ov=$('#ov'), btn1=$('#ovBtn'), btn2=$('#ovBtn2');
function showOv(t,sub,stats,label,hint='',label2=''){
  $('#ovTitle').textContent=t; $('#ovSub').textContent=sub;
  $('#ovStats').innerHTML=(stats||[]).map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('');
  btn1.textContent=label; btn2.textContent=label2; btn2.hidden=!label2;
  $('#ovHint').textContent=hint; ov.hidden=false; btn1.focus();
}
function hideOv(){ ov.hidden=true; }
function pause(){ if(state!=='play'||!L) return; state='pause'; keys.left=keys.right=keys.jump=false;
  showOv('일시정지','',null,'계속','R 마지막 등불에서 다시 · M 소리 끄기','장 처음으로'); }
const resetTotal=()=>{ total={embers:0,max:0,time:0,deaths:0}; };
btn1.addEventListener('click',()=>{
  initAudio();
  if(state==='title'){ resetTotal(); startLevel(loadSave()); }
  else if(state==='pause'){ state='play'; hideOv(); }
  else if(state==='clear') startLevel(lvl+1);
  else if(state==='end'){ resetTotal(); startLevel(0); }
});
btn2.addEventListener('click',()=>{
  initAudio();
  if(state==='title'){ writeSave(0); resetTotal(); startLevel(0); }
  else if(state==='pause') startLevel(lvl);
});
function titleScreen(){
  const s=loadSave();
  showOv('등불지기','꺼져가는 마을의 등불 10개를 다시 밝히는 밤. 불씨를 모으고 그림자는 밟고, 마지막 성의 그림자 왕까지 쓰러뜨리면 됨.',null,
    s>0?`이어하기 ${s+1}장`:'시작','←→ / A D 이동 · Space / ↑ 점프 · Esc 일시정지', s>0?'처음부터':'');
}
titleScreen();

/* ---------- 입력 ---------- */
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyZ:'jump'};
addEventListener('keydown',e=>{
  const k=KM[e.code];
  if(k){ e.preventDefault(); if(state!=='play'){ if(e.code==='Space'&&!ov.hidden&&!e.repeat) btn1.click(); return; }
    if(k==='jump'&&!keys.jump) jumpPressed=true; keys[k]=true; initAudio(); return; }
  if(e.code==='Escape'||e.code==='KeyP'){ if(state==='play') pause(); else if(state==='pause') btn1.click(); }
  if(e.code==='KeyR'&&L&&(state==='play'||state==='pause')){ if(state==='pause'){state='play';hideOv();} die(); }
  if(e.code==='KeyM') muted=!muted;
});
addEventListener('keyup',e=>{ const k=KM[e.code]; if(k) keys[k]=false; });
addEventListener('blur',()=>{ keys.left=keys.right=keys.jump=false; pause(); });
document.querySelectorAll('#pad [data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{ e.preventDefault(); initAudio(); try{b.setPointerCapture(e.pointerId)}catch(_){}
    if(k==='jump'&&!keys.jump) jumpPressed=true; keys[k]=true; b.classList.add('on'); };
  const off=()=>{ keys[k]=false; b.classList.remove('on'); };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('lostpointercapture',off);
});
$('#pad [data-act="pause"]').addEventListener('click',()=>{ if(state==='play') pause(); else if(state==='pause') btn1.click(); });

/* ---------- 크기/루프 ---------- */
function resize(){
  const area=$('#area'), aw=area.clientWidth, ah=area.clientHeight; if(!aw||!ah) return;
  const asp=clamp(aw/ah,1,2); VW=Math.round(VH*asp);
  const sc=Math.min(aw/VW,ah/VH), dpr=Math.min(2,devicePixelRatio||1);
  const cw=Math.floor(VW*sc), ch=Math.floor(VH*sc), st=$('#stage');
  st.style.width=cw+'px'; st.style.height=ch+'px';
  cvs.width=Math.round(cw*dpr); cvs.height=Math.round(ch*dpr);
  ctx.setTransform(cvs.width/VW,0,0,cvs.height/VH,0,0);
}
new ResizeObserver(resize).observe($('#area')); resize();
L=buildLevel(0); spawn={...L.start}; p=newPlayer();
let last=performance.now(), acc=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; gT+=dt;
  if(state==='play'){ acc+=dt; while(acc>=STEP){ update(STEP); acc-=STEP; } } else acc=0;
  draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
